name: Docs

# Builds the MkDocs documentation site on every push and pull request, and
# publishes it to GitHub Pages whenever a commit lands on `main` (the same
# event that cuts a release in `release.yml`), so the site always documents
# the latest release.
#
# The API reference is generated from the MATLAB help text by
# mkdocstrings-matlab, which parses the sources directly; no MATLAB license is
# needed. `--strict` turns broken links and cross-references into failures.
#
# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-dev.txt

      - name: Install MkDocs and test dependencies
        run: pip install -r docs/requirements-dev.txt

      - name: Test docs hooks
        run: pytest docs/hooks/tests

      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
