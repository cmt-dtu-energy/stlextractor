# in collaboration with Fábio Pinto Fortkamp.

name: Docs

# Builds the MkDocs documentation site on every push and pull request, and
# publishes it to GitHub Pages whenever a commit lands on `main` (the same
# event that cuts a release in `release.yml`), so the site always documents
# the latest release.
#
# The API reference is generated from the MATLAB help text by
# mkdocstrings-matlab, which parses the sources directly. `--strict` turns
# broken links and cross-references into failures.
#
# The Tutorial page, by contrast, needs to show the tutorial's *actual*
# output (printed text and figures), not just its source, so this workflow
# does run MATLAB: docs/tutorials/capture_output.m executes
# Tutorial1_Extract.m cell by cell (each cell in its own `matlab -batch`
# process -- see capture_output.m's own comments for why) and writes
# docs/tutorials/captured_entries/*.json and captured_figures/*.png, which
# docs/hooks/livescript.py interleaves into the rendered page. See
# docs/adr/0001-matlab-ci-for-tutorial-output.md for why. This relies on
# MathWorks' free hosted licensing for public repos on GitHub-hosted
# runners, the same mechanism tests.yml already uses.
#
# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-dev.txt

      - name: Install MkDocs and test dependencies
        run: pip install -r docs/requirements-dev.txt

      - name: Test docs hooks
        run: pytest docs/hooks/tests

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Capture tutorial output
        uses: matlab-actions/run-command@v2
        with:
          command: cd('docs/tutorials'); run('capture_output.m')

      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
